name: Build, Sign & Deploy Apple iOS App (GotChores)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-sign-deploy:
    name: Build, Sign & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selected Xcode: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install Apple Distribution Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_RAW=$RUNNER_TEMP/raw_cert.p12
          CERTIFICATE_PEM=$RUNNER_TEMP/cert_and_key.pem
          CERTIFICATE_LEGACY=$RUNNER_TEMP/legacy_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          if [ ! -x "$OPENSSL_BIN" ]; then
            OPENSSL_BIN=$(which openssl)
          fi
          echo "Using OpenSSL from: $OPENSSL_BIN ($($OPENSSL_BIN version))"

          # Decode certificate safely; use repository mobileprovision file directly if present
          export CERTIFICATE_RAW PP_PATH
          python3 -c "import os, base64; open(os.environ['CERTIFICATE_RAW'], 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64'].strip())); pp_data = open('ios/GotChores/GotChores_AppStore_Distribution_2026.mobileprovision', 'rb').read() if os.path.exists('ios/GotChores/GotChores_AppStore_Distribution_2026.mobileprovision') else base64.b64decode(os.environ.get('PROVISIONING_PROFILE_BASE64', '').strip() + '=' * ((4 - len(os.environ.get('PROVISIONING_PROFILE_BASE64', '').strip()) % 4) % 4)); open(os.environ['PP_PATH'], 'wb').write(pp_data)"
          ls -la "$CERTIFICATE_RAW" "$PP_PATH"

          # Convert PKCS12 using OpenSSL (loading legacy provider if needed for 3DES/RC2 bags)
          if ! "$OPENSSL_BIN" pkcs12 -legacy -in "$CERTIFICATE_RAW" -passin pass:"$P12_PASSWORD" -nodes -out "$CERTIFICATE_PEM" 2>/dev/null; then
            echo "Falling back to standard provider parsing..."
            "$OPENSSL_BIN" pkcs12 -in "$CERTIFICATE_RAW" -passin pass:"$P12_PASSWORD" -nodes -out "$CERTIFICATE_PEM"
          fi

          "$OPENSSL_BIN" pkcs12 -export -in "$CERTIFICATE_PEM" -out "$CERTIFICATE_LEGACY" -passout pass:"$P12_PASSWORD" \
            -legacy -nomaciter -descert \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_LEGACY -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Install provisioning profile under UUID and default names
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(python3 -c "import plistlib, sys, subprocess; content=subprocess.check_output(['security', 'cms', '-D', '-i', sys.argv[1]]); plist=plistlib.loads(content); print(plist.get('UUID', 'ea755e5c-c6b4-420b-a5ef-bc7f26863c84'))" "$PP_PATH" 2>/dev/null || echo "ea755e5c-c6b4-420b-a5ef-bc7f26863c84")
          echo "Installing provisioning profile with UUID: $PP_UUID"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/gotchores_distribution.mobileprovision

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8

      - name: Build and Archive iOS App
        working-directory: ios/GotChores
        run: |
          xcodebuild clean archive \
            -project GotChores.xcodeproj \
            -scheme GotChores \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/GotChores.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=3BWVS7PL6M \
            PROVISIONING_PROFILE_SPECIFIER="GotChores AppStore Distribution 2026"

      - name: Export Signed IPA for App Store
        working-directory: ios/GotChores
        run: |
          xcodebuild -exportArchive \
            -archivePath build/GotChores.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/exported \
            -allowProvisioningUpdates

      - name: Validate App with App Store Connect
        run: |
          IPA_PATH=$(find ios/GotChores/build/exported -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}"

      - name: Upload App to TestFlight
        run: |
          IPA_PATH=$(find ios/GotChores/build/exported -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}"

      - name: Upload IPA Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotchores-ios-ipa
          path: ios/GotChores/build/exported/*.ipa
          retention-days: 14

      - name: Cleanup Keychain and Keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
